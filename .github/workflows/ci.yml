name: Test with pytest

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"

    - name: Install development package dependencies
      run: |
        sudo apt update && sudo apt install -y \
          xvfb \
          libxkbcommon-x11-0 \
          alsa-utils \
          pyqt5-dev-tools
        
    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0
      with:
        version: "0.9.11"

    - name: Install the project
      run: |
        uv sync

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        uv run flake8 . \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics \
          --extend-exclude=.venv

        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . \
          --count \
          --exit-zero \
          --max-complexity=10 \
          --max-line-length=127 \
          --statistics \
          --extend-exclude=.venv

    - name: Run unit tests
      run: |
        uv run pytest
