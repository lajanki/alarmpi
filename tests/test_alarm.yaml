main:
  alarm_time: 07:02
  low_brightness: 12
  full_brightness_on_alarm: true
  nighttime:
    enabled: true
    start: '22:00'
    end: '07:00'
  TTS:
    handler: piper
    model_path: voices/en_US-lessac-medium.onnx

alsa:
  device_idx: 1

content:
  greeting:
    handler: greeting
    template: "Good {period}. It's {weekday} {month} {day_of_month}. The time is {time}.\n\n"

  openweathermap.org:
    enabled: false
    handler: weather
    credentials: /path/to/file.dat
    city_id: null
    units: metric

  BBC_news:
    enabled: true
    handler: bbc_news

  farewell:
    enabled: true
    text: Thats all for now. Have a nice day.

radio:
  enabled: true
  urls:
    Foo: www.example.com
  default: Foo
  args: ""

media:
  enabled: false

plugins:
  HSL:
    enabled: false
    trains: 5
    station_code: KE

  DHT22:
    enabled: false
    GPIO: 4

  openweathermap.org:
    enabled: false