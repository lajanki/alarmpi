[project]
name = "alarmpi"
version = "3.6.0"
description = "Alarm Clock Radio for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adafruit-circuitpython-dht",
    "feedparser",
    "google-cloud-texttospeech",
    "mutagen",
    "num2words",
    "pydub",
    "PyQt5",
    "pyqtspinner",
    "python-dateutil",
    "pyyaml",
    "requests",
    "RPi.GPIO"
]

[dependency-groups]
dev = [
    "flake8",
    "freezegun",
    "ipython",
    "pytest",
    "pytest-xvfb"
]

[project.scripts]
alarmpi = "alarmpi.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alarmpi"]

